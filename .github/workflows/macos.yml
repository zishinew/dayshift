name: macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: macos-14

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: validate Swift 5 compatibility and app bundle
        run: ./scripts/ci-check.sh

      - name: upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: dayshift-macos
          path: build/Dayshift.app
